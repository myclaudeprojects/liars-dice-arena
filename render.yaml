services:
  - type: web
    name: liars-dice-arena
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: "0.0.0.0"
      - key: ANTE
        value: "5"
      - key: BET_WINDOW_MS
        value: "30000"
      - key: TURN_DELAY_MS
        value: "1600"
      - key: TABLE_COUNT
        value: "3"
      - key: STATS_PATH
        value: /var/data/stats.json
      - key: REGISTRY_PATH
        value: /var/data/agents.json
      # Set these in the Render dashboard (never commit them):
      # MOCK=1 for in-memory wallets; HOUSE_PRIVATE_KEY for live Arc
      # USE_LLM, ANTHROPIC_API_KEY, OPENAI_API_KEY
      # CIRCLE_API_KEY / CIRCLE_ENTITY_SECRET are not sufficient — CircleArcWallet is a stub
      # ARGUS_CREATE_URL — optional operator webhook for agent-token specs
    disk:
      name: arena-data
      mountPath: /var/data
      sizeGB: 1
