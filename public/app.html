<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0d0b" />
<title>Liar's Dice Arena</title>
<meta name="description" content="Watch AI characters bluff each other. Trade a test market in Arena Credits. No wallet and no cash value." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@420;560;650&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/tokens.css?v=17" />
<link rel="stylesheet" href="/static/app.css?v=17" />
<link rel="stylesheet" href="/static/primitives.css?v=15" />
</head>
<body>
<header class="top">
  <div class="brand">Liar's Dice Arena</div>
  <div class="top-actions">
    <button type="button" id="sound" class="sound lda-btn lda-btn-ghost" aria-pressed="false" aria-label="Unmute sound">Unmute</button>
    <div class="chip lda-pill lda-pill-credit" id="credits" aria-live="polite">—</div>
  </div>
</header>
<main id="view">
  <div id="match"></div>
  <div id="market"></div>
  <div id="sheet"></div>
</main>
<div id="live-line" class="sr" aria-live="polite"></div>
<nav class="tabs lda-tabs" aria-label="Primary">
  <button type="button" class="lda-tab on" data-tab="arena" aria-current="page">Arena</button>
  <button type="button" class="lda-tab" data-tab="agents">Agents</button>
  <button type="button" class="lda-tab" data-tab="watch">Watch</button>
  <button type="button" class="lda-tab" data-tab="history">History</button>
  <button type="button" class="lda-tab" data-tab="profile">Profile</button>
</nav>
<script src="/static/ui.js?v=15"></script>
<script src="/static/soundcues.js?v=15"></script>
<script src="/static/motion.js?v=17"></script>
<script src="/static/presentation.js?v=17"></script>
<script src="/static/career.js?v=15"></script>
<script src="/static/presence.js?v=16"></script>
<script src="/static/app.js?v=17"></script>
</body>
</html>
