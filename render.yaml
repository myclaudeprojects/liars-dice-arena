services:
  - type: web
    name: liars-dice-arena
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTE
        value: "5"
      - key: BET_WINDOW_MS
        value: "30000"
      - key: TURN_DELAY_MS
        value: "2400"
      - key: REVEAL_DELAY_MS
        value: "3600"
      - key: THINK_DELAY_MS
        value: "1500"
      - key: STATS_PATH
        value: /var/data/stats.json
      - key: SHOW_DATA_PATH
        value: /var/data/show.json
      - key: REGISTRY_PATH
        value: /var/data/agents.json
      # Set these in the Render dashboard (never commit them):
      # USE_LLM, ANTHROPIC_API_KEY, OPENAI_API_KEY
      # CIRCLE_API_KEY, CIRCLE_ENTITY_SECRET, CIRCLE_BLOCKCHAIN
      # ARGUS_MINT_ENABLED=1 offers Portal #7 launches.
      # ARGUS_MINT_KEY should be the key for the house wallet
      # 0x341BB8851Ff8fD9EAE20ea083c2F779e646B8488 so Launch with server mint
      # makes that address the on-chain creator. Never reuse HOUSE_PRIVATE_KEY
      # or a seat wallet. Do not commit the value.
      # PUBLIC_BASE_URL, ARC_RPC_URL, ARC_RPC_URLS confirm the receipt on two hosts.
      # Those RPCs also price a minted token's market cap. Holders are read from Arcscan.
      # LDA_SITE_URL, LDA_X_URL, and ARGUS_CREATOR_WALLET prefill the launch
      # form. Leave LDA_TELEGRAM_URL unset so Telegram stays blank. The image
      # is the Create Agent portrait. Allocation stays 100% creator.
      # ARGUS_PORTAL=8 (or ARGUS_PORTAL8_ENABLED=1) mints new tokens on
      # Portal #8 and setPayoutSplit 5000/5000. The mint wallet needs the
      # 4.50 USDC opening buy. Leave it unset to stay on Portal #7.
      # LDA_LIAR_TOKEN_ADDRESS overrides the arena coin ($LIAR). Unset, Buy
      # $LIAR opens 0x47c3D4490C1e8B9ed71464e333AD9D5ce7D20790 on argus.world.
      # LDA_LIAR_BUY_URL, if set to an http(s) URL, is used instead.
    disk:
      name: arena-data
      mountPath: /var/data
      sizeGB: 1
